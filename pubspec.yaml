name: altera
description: "ALTERA - Gemini 2.0 Flash tabanlı, 3 otonom ajandan oluşan kişisel finans yönetim uygulaması."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.7.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Lokalizasyon desteği (TR + EN)
  flutter_localizations:
    sdk: flutter

  # Gemini 2.0 Flash Dart SDK - AI analiz çekirdeği
  google_generative_ai: ^0.4.6

  # Reaktif state yönetimi - UI/ajan durum senkronizasyonu
  flutter_riverpod: ^2.5.1

  # Riverpod code generation için annotation'lar
  riverpod_annotation: ^2.3.5

  # İşlem geçmişi için AES-256 şifreli SQL veritabanı
  sqflite_sqlcipher: ^2.2.1

  # SQLite dosya yolu yönetimi
  path: ^1.9.0

  # Kullanıcı tercihleri için key-value NoSQL (hızlı okuma)
  hive_flutter: ^1.1.0

  # Pasta + çubuk + çizgi grafikler (dashboard)
  fl_chart: ^0.69.0

  # Bütçe aşım bildirimleri - internet gerektirmez
  flutter_local_notifications: ^17.2.2

  # Tip-güvenli navigasyon
  go_router: ^14.0.0

  # Para formatı + tarih yerelleştirme (TL, Türkçe tarih)
  intl: ^0.20.2

  # Gemini API key güvenli saklama (Keychain/Keystore)
  flutter_secure_storage: ^9.2.2

  # Yükleme iskelet efekti (ajan analiz beklerken)
  shimmer: ^3.0.0

  # Ajan çalışma animasyonları
  lottie: ^3.1.2

  # UUID üretimi (transaction ve log ID'leri için)
  uuid: ^4.4.0

  # Dosya seçici (PDF + Excel içe aktarma)
  file_picker: ^8.1.2

  # Excel dosyası parse (yerel, sunucuya gönderilmez)
  excel: ^4.0.6

  # Dosya/kamera izin yönetimi
  permission_handler: ^11.3.1

  # Material icons
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: ^2.3.0
  syncfusion_flutter_pdf: ^33.2.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation çalıştırıcısı (Riverpod generator için)
  build_runner: ^2.4.11

  # Provider otomatik üretimi (riverpod_annotation ile birlikte)
  riverpod_generator: ^2.4.3

  # Dart kod kalite kuralları
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # ARB lokalizasyon dosyası üretimi için
  generate: true

  assets:
    - assets/data/investment_funds.json
